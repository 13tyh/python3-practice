services:
  app:
    build: .
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      MONGO_URI: mongodb://mongo:27017
      PYTHONPATH: /workspace/src
    depends_on:
      - mongo
    command: sleep infinity

  api:
    build: .
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      MONGO_URI: mongodb://mongo:27017
      PYTHONPATH: /workspace/src
    depends_on:
      - mongo
    ports:
      - "8000:8000"
    command: uvicorn tools.learning_api:app --host 0.0.0.0 --port 8000 --reload --reload-dir /workspace/tools --reload-dir /workspace/docs

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./docker/mongo-init:/docker-entrypoint-initdb.d:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    working_dir: /workspace/frontend
    volumes:
      - ./frontend:/workspace/frontend
      - frontend_node_modules:/workspace/frontend/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      VITE_API_BASE: http://localhost:8000
    ports:
      - "5173:5173"
    command: pnpm dev

volumes:
  mongo_data:
  frontend_node_modules:
