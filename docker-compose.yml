services:
  app:
    build: .
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      MONGO_URI: mongodb://mongo:27017
      PYTHONPATH: /workspace/src
    depends_on:
      - mongo
    command: sleep infinity
    healthcheck:
      test: ["CMD", "python", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3

  api:
    build: .
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      MONGO_URI: mongodb://mongo:27017
      PYTHONPATH: /workspace/src
    depends_on:
      - mongo
    ports:
      - "8000:8000"
    command: uvicorn tools.learning_api:app --host 0.0.0.0 --port 8000 --reload --reload-dir /workspace/tools --reload-dir /workspace/docs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./docker/mongo-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    working_dir: /workspace/frontend
    volumes:
      - ./frontend:/workspace/frontend
      - frontend_node_modules:/workspace/frontend/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      VITE_API_BASE: http://localhost:8000
    ports:
      - "5173:5173"
    command: pnpm dev
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5

  mongo-express:
    image: mongo-express:1
    profiles: ["tools"]
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongo
    ports:
      - "8081:8081"

volumes:
  mongo_data:
  frontend_node_modules:
